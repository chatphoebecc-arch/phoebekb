<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存档 · 个人网站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF9F6;
    --ink: #1C1B1A;
    --ink-soft: #55524C;
    --ink-faint: #9A968C;
    --accent: #3F6659;
    --accent-soft: #E8EEEA;
    --line: #DEDAD1;
    --serif: 'Noto Serif SC', serif;
    --sans: 'Inter', 'Noto Sans SC', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html{ scroll-behavior: smooth; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; text-decoration: none; }

  .wrap{
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---------- Header ---------- */
  header{
    padding: 64px 0 96px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  h1{
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(32px, 5vw, 52px);
    line-height: 1.25;
    max-width: 720px;
    letter-spacing: -0.01em;
  }
  header p{
    margin-top: 20px;
    max-width: 520px;
    color: var(--ink-soft);
    font-size: 16px;
  }

  /* ---------- Catalog (signature element) ---------- */
  main{ padding: 72px 0 40px; }
  .catalog-label{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    margin-bottom: 28px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .catalog-label::after{
    content: '';
    flex: 1;
    border-bottom: 1px dotted var(--line);
  }

  .catalog{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  @media (max-width: 720px){
    .catalog{ grid-template-columns: 1fr; }
  }

  .card{
    background: var(--bg);
    padding: 40px 36px;
    position: relative;
    transition: background 0.25s ease;
  }
  .card:hover{ background: var(--accent-soft); }

  .card .no{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 24px;
  }
  .card h2{
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .card p{
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 28px;
  }
  .card .enter{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink);
    letter-spacing: 0.04em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .card .enter .arrow{
    transition: transform 0.2s ease;
  }
  .card:hover .enter .arrow{ transform: translateX(4px); }

  /* ---------- Footer ---------- */
  footer{
    margin-top: 96px;
    padding: 32px 0 64px;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-faint);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Personal Archive</div>
    <h1>设计与思考的存档地。</h1>
    <p>这里存放两类东西：正在做的设计作品，和沉淀下来的方法与笔记。两者互为脚注。</p>
  </header>

  <main>
    <div class="catalog-label">目录 · Index</div>
    <div class="catalog">
      <a class="card" href="portfolio/index.html">
        <span class="no">NO. 01 — WORK</span>
        <h2>作品集</h2>
        <p>产品设计案例、原型探索、界面细节记录。</p>
        <span class="enter">进入 <span class="arrow">→</span></span>
      </a>
      <a class="card" href="notes/index.html">
        <span class="no">NO. 02 — NOTES</span>
        <h2>知识库</h2>
        <p>方法论、行业观察、持续更新的手记。</p>
        <span class="enter">进入 <span class="arrow">→</span></span>
      </a>
    </div>
  </main>

  <footer>
    <span>© <span id="year"></span> · Built with plain HTML</span>
    <span>Updated continuously</span>
  </footer>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
